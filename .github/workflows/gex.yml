name: GEX levels

# Runs once a day at 09:00 New York time, Monday-Friday: before the open,
# after Yahoo has picked up the previous session's open interest.
# GitHub cron is UTC-only, so the time is listed for both EDT (UTC-4) and
# EST (UTC-5); the "gate" step keeps only the one matching today's offset.
# Scheduled runs can start several minutes late.
on:
  schedule:
    - cron: "0 13 * * 1-5"   # 09:00 EDT
    - cron: "0 14 * * 1-5"   # 09:00 EST
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers (space separated)"
        default: "META SPY QQQ TSLA BABA MU AMD SPCX"

env:
  TICKERS: META SPY QQQ TSLA BABA MU AMD SPCX   # tickers for scheduled runs
  DATA_BRANCH: gex-data    # results and history are committed here

permissions:
  contents: write

concurrency:
  group: gex
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Gate on New York time
        id: gate
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -z "$SCHEDULE" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          offset=$(TZ=America/New_York date +%z)
          case "$offset:$SCHEDULE" in
            "-0400:0 13 * * 1-5"|"-0500:0 14 * * 1-5") run=true ;;
            *) run=false ;;
          esac
          echo "NY offset $offset, schedule '$SCHEDULE' -> run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Check out data branch
        if: steps.gate.outputs.run == 'true'
        run: |
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null; then
            git fetch --depth 1 origin "$DATA_BRANCH"
            git worktree add data FETCH_HEAD
            git -C data checkout -B "$DATA_BRANCH"
          else
            git worktree add --detach data
            git -C data checkout --orphan "$DATA_BRANCH"
            git -C data rm -rfq .
            printf '*.png\ncontracts.csv\n' > data/.gitignore
          fi

      - name: Run GEX
        if: steps.gate.outputs.run == 'true'
        env:
          PYTHONPATH: src
          INPUT_TICKERS: ${{ inputs.tickers }}
        run: python -m gex ${INPUT_TICKERS:-$TICKERS} -o data/output | tee data/last_run.txt

      - name: Job summary
        if: steps.gate.outputs.run == 'true' && always()
        run: |
          {
            echo '```'; cat data/last_run.txt 2>/dev/null; echo '```'
            for f in data/output/latest/*_tradingview.txt; do
              [ -e "$f" ] || continue
              echo "**$(basename "$f" _tradingview.txt)** TradingView levels:"
              echo '```'; cat "$f"; echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload charts
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: gex-${{ github.run_id }}
          path: data/output/*/*/
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit results
        if: steps.gate.outputs.run == 'true' && always()
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -qm "GEX run $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"
          for i in 1 2 3; do git push origin "HEAD:$DATA_BRANCH" && exit 0; sleep $((i * 5)); done
          exit 1
