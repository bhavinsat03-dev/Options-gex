name: GEX levels

# Runs at 09:50, 12:30 and 15:00 New York time, Monday-Friday. 09:50 lets
# the opening quotes settle; it is the main run for the day's levels.
# GitHub cron is UTC-only and can start runs late or skip them, so each time
# is listed for both EDT (UTC-4) and EST (UTC-5). The "gate" step
# (.github/scripts/gate.py) runs the latest slot that started in the last two
# hours and hasn't run yet today, so the second listing acts as a retry.
on:
  schedule:
    - cron: "50 13 * * 1-5"  # 09:50 EDT
    - cron: "50 14 * * 1-5"  # 09:50 EST
    - cron: "30 16 * * 1-5"  # 12:30 EDT
    - cron: "30 17 * * 1-5"  # 12:30 EST
    - cron: "0 19 * * 1-5"   # 15:00 EDT
    - cron: "0 20 * * 1-5"   # 15:00 EST
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers (space separated)"
        default: "META SPY QQQ TSLA BABA MU AMD SPCX IWM"
      slot:
        description: "Claim a schedule slot, e.g. '2026-10-21 09:50' (posts and marks it done)"
        default: ""
      max_dte:
        description: "One-off expiry window in days (e.g. 72); written to adhoc/, no history"
        default: ""
      notify:
        description: "Post the update to the GEX updates issue"
        type: boolean
        default: false

env:
  TICKERS: META SPY QQQ TSLA BABA MU AMD SPCX IWM   # tickers for scheduled runs
  WEEKLY_TICKERS: SPY QQQ  # extra table using only the next 7 days of expirations
  DATA_BRANCH: gex-data    # results and history are committed here

permissions:
  contents: write
  issues: write

concurrency:
  group: gex
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Gate on New York time
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          CLAIMED_SLOT: ${{ inputs.slot }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/output/latest/slots.txt?ref=$DATA_BRANCH" \
            -H "Accept: application/vnd.github.raw" > /tmp/slots.txt 2>/dev/null || : > /tmp/slots.txt
          python3 .github/scripts/gate.py "$GITHUB_EVENT_NAME" /tmp/slots.txt "$CLAIMED_SLOT" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Check out data branch
        if: steps.gate.outputs.run == 'true'
        run: |
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null; then
            git fetch --depth 1 origin "$DATA_BRANCH"
            git worktree add data FETCH_HEAD
            git -C data checkout -B "$DATA_BRANCH"
          else
            git worktree add --detach data
            git -C data checkout --orphan "$DATA_BRANCH"
            git -C data rm -rfq .
            printf '*.png\ncontracts.csv\n' > data/.gitignore
          fi

      - name: Run one-off window
        if: steps.gate.outputs.run == 'true' && inputs.max_dte != ''
        env:
          PYTHONPATH: src
          INPUT_TICKERS: ${{ inputs.tickers }}
          MAX_DTE: ${{ inputs.max_dte }}
        run: |
          python -m gex $INPUT_TICKERS --max-dte "$MAX_DTE" --no-history --no-plots \
            --title "One-off (next $MAX_DTE days)" -o data/adhoc

      - name: Run GEX
        if: steps.gate.outputs.run == 'true' && inputs.max_dte == ''
        env:
          PYTHONPATH: src
          INPUT_TICKERS: ${{ inputs.tickers }}
          SLOT: ${{ steps.gate.outputs.slot }}
        run: |
          python -m gex ${INPUT_TICKERS:-$TICKERS} -o data/output | tee data/last_run.txt
          if [ "$SLOT" != "manual" ]; then
            echo "$SLOT" >> data/output/latest/slots.txt
            tail -n 60 data/output/latest/slots.txt > /tmp/s && mv /tmp/s data/output/latest/slots.txt
          fi

      - name: Run weekly SPY/QQQ table
        if: steps.gate.outputs.run == 'true' && inputs.max_dte == ''
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          python -m gex $WEEKLY_TICKERS --max-dte 7 --no-history --no-plots \
            --title "Weekly expiries (next 7 days): SPY & QQQ" -o data/weekly
          { echo; echo "---"; echo; cat data/weekly/latest/brief.md; } >> data/output/latest/brief.md

      - name: Job summary
        if: steps.gate.outputs.run == 'true' && always()
        run: |
          brief=data/output/latest/brief.md
          [ -n "${{ inputs.max_dte }}" ] && brief=data/adhoc/latest/brief.md
          cat "$brief" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No brief produced" >> "$GITHUB_STEP_SUMMARY"

      # Scheduled runs (and manual runs with "notify") post the two-table brief as a
      # comment on the "GEX updates" issue, which sends a GitHub notification.
      - name: Post update
        if: steps.gate.outputs.run == 'true' && inputs.max_dte == '' && (github.event_name == 'schedule' || inputs.notify || inputs.slot != '') && hashFiles('data/output/latest/brief.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: GEX updates
        run: |
          num=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title -q ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -z "$num" ]; then
            num=$(gh issue create --title "$TITLE" --body "Each scheduled GEX run posts its levels and dealer-positioning tables here. Subscribe to get notified." | grep -o '[0-9]*$')
          fi
          gh issue comment "$num" --body-file data/output/latest/brief.md

      - name: Upload charts
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: gex-${{ github.run_id }}
          path: data/output/*/*/
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit results
        if: steps.gate.outputs.run == 'true' && always()
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -qm "GEX run $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"
          for i in 1 2 3; do git push origin "HEAD:$DATA_BRANCH" && exit 0; sleep $((i * 5)); done
          exit 1
